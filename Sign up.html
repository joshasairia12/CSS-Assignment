<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<h1>Registeraton Form</h1>
    <form action="#" method="post">
    <label for="full name">Full Name:</label><br>
    <input type="text" id="Full Name"placeholders=E.G Joshua  Augustine, required><br>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email"placeholders required><br>
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password"required><br>
    <label for="confirm password">Confirm Password</label><br>
    <input type="Password" id="confirm Password"><br>
    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age"><br>
    <label for="date of birth">Date Of Birth:</label><br>
    <input type="date" id="date of birth" name="date of birth"><br> 
    <p><strong>Preferred Contact Method.</strong></p>
    <input type="radio" id="contact" name="fav_language" value="Phone contact">
    <label for="contact">Phone contact</label><br>
    <input type="radio" id="email" name="fav_language" value="Email">
    <label for="email">Email</label>
    <br>
    <label for="Country">Select a Country:</label>
    <select id="Country" name="Country">
    <option value="Nigeria"> Nigeria</option>
    <option value="Niger">Niger</option>
    <option value="Ghana">Ghana</option>
    <option value="Cameroon">Cameroon</option>
    </select><br>
    <br>
    <label for="bio">Tell us about yourself in the space provided:</label><br>
    <textarea id="bio" name="bio" rows="4" columns="50"></textarea><br>
    <br>
    <input type="checkbox" id="terms and conditions" name="terms and conditions" value="Agree to terms and conditions">
    <label for="terms and conditions">I Agree to terms and conditions.</label><br>
    <br>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset"><br>
    <br>
    Thank you for your info.
